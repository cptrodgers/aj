[package]
name = "aj_core"
version = "0.8.0"
edition = "2021"
authors = ["cptrodgers <me@cptrodgers.com>"]
description = "Background Job Library for Rust"
readme = "README.md"
repository = "https://github.com/cptrodgers/aj"
license = "MIT OR Apache-2.0"
keywords = ["background-job", "cron", "schedule", "interval"]
include = ["**/*.rs", "Cargo.toml"]

[lib]
name = "aj_core"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = []
redis = ["dep:redis"]

[dependencies]
uuid = { version = "1.8", features = ["serde", "v4"] }
# tokio-comp brings in `aio`; `aio` alone lacks tokio/net. Default features are kept
# because `script` lives there and gates `Script`, which the Lua call sites need.
redis = { version = "0.25.3", optional = true, features = ["tokio-comp", "connection-manager"] }
cron = "0.12.0"
kameo = "0.13"
serde = { version = "1.0.64", features = ["derive"] }
serde_json = "1.0.64"
serde_with = { version = "3.6.1", features = ["chrono_0_4"] }
chrono = { version = "0.4.34" }
log = "0.4"
lazy_static = { version = "1.4.0" }
async-trait = "0.1.74"
dashmap = "5.5.3"
tokio = { version = "1.23.1", features = ["sync", "time"] }

[dev-dependencies]
# `#[tokio::test]` needs macros + rt. These arrive transitively via kameo today, but
# relying on another crate's feature selection for our own test harness is fragile.
tokio = { version = "1.23.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
