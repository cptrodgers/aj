[package]
name = "aj_core"
version = "0.9.1"
edition = "2021"
authors = ["cptrodgers <me@cptrodgers.com>"]
description = "Background Job Library for Rust"
readme = "README.md"
repository = "https://github.com/cptrodgers/aj"
license = "MIT OR Apache-2.0"
keywords = ["background-job", "cron", "schedule", "interval"]
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.docs.rs]
# Deliberately not `all-features = true`: that would pull in redis 0.25.4, which no longer
# compiles on recent nightlies (it relies on the old `!` type fallback, and docs.rs builds
# with nightly), taking the whole docs build down with it. Listing features explicitly keeps
# the Postgres backend documented. Restore `all-features` once the redis dep is upgraded.
features = ["postgres-tls"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "aj_core"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[features]
default = []
redis = ["dep:redis"]
postgres = ["dep:deadpool-postgres"]
# TLS for the Postgres backend. Separate from `postgres` because rustls, a crypto
# provider and two root stores are a lot to hand someone who only talks to localhost.
postgres-tls = [
    "postgres",
    "dep:tokio-postgres-rustls",
    "dep:rustls",
    "dep:rustls-native-certs",
    "dep:webpki-roots",
]

[dependencies]
uuid = { version = "1.8", features = ["serde", "v4"] }
# tokio-comp brings in `aio`; `aio` alone lacks tokio/net. Default features are kept
# because `script` lives there and gates `Script`, which the Lua call sites need.
redis = { version = "0.25.3", optional = true, features = ["tokio-comp", "connection-manager"] }
# Re-exports tokio_postgres, and its default features already include rt_tokio_1, so this
# single dependency covers both the driver and the pool.
deadpool-postgres = { version = "0.14", optional = true }
# Depends on tokio-postgres 0.7 and rustls 0.23, the same majors deadpool-postgres and
# the direct rustls dep below resolve to, so cargo unifies them into one tree.
tokio-postgres-rustls = { version = "0.14", optional = true, default-features = false }
# Direct dep so `tls_config` can take a ClientConfig and we can re-export a version-matched
# `rustls`. `ring` over `aws-lc-rs`: no cmake/nasm, cross-compiles cleanly.
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std"] }
rustls-native-certs = { version = "0.8", optional = true }
webpki-roots = { version = "1", optional = true }
cron = "0.12.0"
kameo = "0.13"
serde = { version = "1.0.64", features = ["derive"] }
serde_json = "1.0.64"
serde_with = { version = "3.6.1", features = ["chrono_0_4"] }
chrono = { version = "0.4.34" }
log = "0.4"
lazy_static = { version = "1.4.0" }
async-trait = "0.1.74"
dashmap = "5.5.3"
tokio = { version = "1.23.1", features = ["sync", "time"] }

[dev-dependencies]
# `#[tokio::test]` needs macros + rt. These arrive transitively via kameo today, but
# relying on another crate's feature selection for our own test harness is fragile.
tokio = { version = "1.23.1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
