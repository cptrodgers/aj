[package]
name = "aj"
version = "0.9.1"
edition = "2021"
authors = ["cptrodgers <me@cptrodgers.com>"]
description = "Background Job Library for Rust"
readme = "README.md"
repository = "https://github.com/cptrodgers/aj"
license = "MIT OR Apache-2.0"
keywords = ["background-job", "cron", "schedule", "interval"]
include = ["**/*.rs", "Cargo.toml"]

[package.metadata.docs.rs]
# Deliberately not `all-features = true`: that would pull in redis 0.25.4, which no longer
# compiles on recent nightlies (it relies on the old `!` type fallback, and docs.rs builds
# with nightly), taking the whole docs build down with it. Listing features explicitly keeps
# the Postgres backend documented. Restore `all-features` once the redis dep is upgraded.
features = ["postgres-tls"]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "aj"

[features]
default = []
redis = ["aj_core/redis"]
postgres = ["aj_core/postgres"]
postgres-tls = ["postgres", "aj_core/postgres-tls"]

[dependencies]
aj_macro = { version = "=0.9.1", path = "../aj_macro" }
aj_core = { version = "=0.9.1", path = "../aj_core" }
serde = { version = "1.0.64", features = ["derive"] }
tokio = { version = "1.23.1", features = ["rt", "macros"] }
lazy_static = { version = "1.4.0" }
